# 生产环境配置：安全、性能优先（关闭 SQL 日志和接口文档、缩短会话、连接池调优）
spring:
  session:
    timeout: 86400 # 24 小时
  datasource:
    url: jdbc:mysql://my-oj-db:3306/oj_db
    username: root
    # 由部署环境注入，缺失时启动失败
    password: ${MYSQL_PASSWORD}
    # 连接池调优
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      max-lifetime: 1800000
server:
  # 容器内必须监听所有网卡，宿主机端口映射才能访问（compose 只把端口绑在 127.0.0.1）
  address: 0.0.0.0
  port: 8101
  servlet:
    session:
      timeout: 86400 # 会话 24 小时过期
      cookie:
        max-age: 86400 # cookie 24 小时过期
  # 响应压缩
  compression:
    enabled: true
    min-response-size: 1024
mybatis-plus:
  configuration:
    log-impl: '' # 生产关闭 SQL 日志（性能 + 不泄漏查询数据）
# 彻底关闭接口文档（knife4j + springdoc），防止泄露接口结构
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
# 代码沙箱
codesandbox:
  type: remote
  # 沙箱服务器地址由部署环境注入，缺失时启动失败
  url: ${CODESANDBOX_URL}
  auth:
    # 生产密钥由部署环境注入，严禁写入仓库；缺失时应用启动即失败（fail-fast）
    key-id: ${CODESANDBOX_AUTH_KEY_ID:}
    private-key: ${CODESANDBOX_AUTH_PRIVATE_KEY:}
