# 生产环境配置：安全、性能优先（关闭 SQL 日志和接口文档、缩短会话、连接池调优）
spring:
  session:
    timeout: 86400 # 24 小时
  datasource:
    url: jdbc:mysql://my-oj-db:3306/oj_db
    username: root
    password: MYSQL_PASSWORD_PLACEHOLDER
    # 连接池调优
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      max-lifetime: 1800000
server:
  port: 8101
  servlet:
    session:
      timeout: 86400 # 会话 24 小时过期
      cookie:
        max-age: 86400 # cookie 24 小时过期
  # 响应压缩
  compression:
    enabled: true
    min-response-size: 1024
mybatis-plus:
  configuration:
    log-impl: '' # 生产关闭 SQL 日志（性能 + 不泄漏查询数据）
# 彻底关闭接口文档（knife4j + springdoc），防止泄露接口结构
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
# 代码沙箱
codesandbox:
  type: remote
  # 沙箱服务器内网地址（部署时可按需用 --codesandbox.url 覆盖）
  url: http://CODESANDBOX_PROD_URL_PLACEHOLDER:8100
