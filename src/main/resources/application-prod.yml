# 生产环境配置：安全、性能优先（关闭 SQL 日志和接口文档、缩短会话、连接池调优）
# 本文件是生产配置的唯一来源；秘密和部署相关的值从环境变量读取（compose 从 deploy/.env 传入，模板见 deploy/.env.example），
# 引用的环境变量缺失时启动即失败。
spring:
  datasource:
    # my-oj-db 是 deploy/docker-compose.yml 中的数据库服务名
    url: jdbc:mysql://my-oj-db:3306/oj_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # 应用专用账号，只授权 oj_db，不用 root（账号由 compose 的 MYSQL_USER 创建）
    username: oj_app
    password: ${MYSQL_PASSWORD}
    # 连接池调优
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      max-lifetime: 1800000
server:
  # 容器内必须监听所有网卡，宿主机端口映射才能访问（compose 只把端口绑在 127.0.0.1）
  address: 0.0.0.0
  port: 8101
  servlet:
    session:
      timeout: 86400 # 会话 24 小时过期
      cookie:
        max-age: 86400 # cookie 24 小时过期
  # 响应压缩
  compression:
    enabled: true
    min-response-size: 1024
mybatis-plus:
  configuration:
    log-impl: '' # 生产关闭 SQL 日志（性能 + 不泄漏查询数据）
# 彻底关闭接口文档（knife4j + springdoc），防止泄露接口结构
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
# 代码沙箱
codesandbox:
  type: remote
  # 沙箱服务器地址，不带 /executeCode 后缀
  url: ${CODESANDBOX_URL}
  auth:
    # 生产密钥对，私钥严禁写入仓库；key-id 必须与沙箱生产配置一致
    key-id: ${CODESANDBOX_AUTH_KEY_ID}
    private-key: ${CODESANDBOX_AUTH_PRIVATE_KEY}
# AI 陪练：调用真实模型；用户 Key 的加密主密钥由部署环境注入，缺失时启动失败
ai:
  mode: live
  key-encryption-key: ${AI_KEY_ENCRYPTION_KEY}
