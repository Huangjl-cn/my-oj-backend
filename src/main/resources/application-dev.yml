# 开发环境配置：clone 后无需任何额外文件即可启动（mvn spring-boot:run 会自动激活本 profile）。
# 本机差异用环境变量覆盖（下方 ${变量:默认值}），或在项目根目录建 config/application-dev.yml
# （Spring Boot 自动加载、已被 gitignore），不要直接改本文件。
spring:
  # 开发库默认值与 deploy/docker-compose.dev.yml 一致（root / oj_dev）
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/oj_db}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:oj_dev}
server:
  # 开发服务默认只监听本机；需要其他机器访问时设 SERVER_ADDRESS=0.0.0.0
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8102
  servlet:
    session:
      timeout: 2592000 # 会话 30 天过期（普通 servlet 会话以此为准）
      cookie:
        max-age: 2592000 # cookie 30 天过期
mybatis-plus:
  configuration:
    # 打开 SQL 日志，方便本地调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 接口文档（Knife4j）
knife4j:
  enable: true
# 代码沙箱
codesandbox:
  # 默认用模拟沙箱（不依赖真实沙箱，判题结果是假的，只用于跑通流程）；
  # 联调真实沙箱时设 CODESANDBOX_TYPE=remote，并按需设 CODESANDBOX_URL
  type: ${CODESANDBOX_TYPE:example}
  url: ${CODESANDBOX_URL:http://localhost:8100}
  # 调用鉴权：ECDSA 请求签名（协议见 docs/sandbox-auth/README.md）
  auth:
    # 【开发专用测试密钥对】与 my-oj-sandbox 的 application-dev.yml 公钥配对。
    # 该私钥已公开，只能用于本机开发；生产沙箱只信任生产公钥，这把私钥在生产无效。
    # 生产密钥由部署环境变量注入（见 application-prod.yml），严禁写入仓库。
    key-id: sandbox-key-dev-2026
    private-key: MEECAQAwEwYHKoZIzj0CAQYIKoZIzj0DAQcEJzAlAgEBBCA3g4tm7fJYlnSAbBjD7pU8exOMaXToOSfNkCuMzfmfDQ==
# AI 陪练：默认用模拟模型（不需要任何 Key，返回固定话术）；联调真实模型时设 AI_MODE=live，再在页面上保存自己的 DeepSeek Key
ai:
  mode: ${AI_MODE:mock}
  # 【开发专用加密主密钥】已公开，只用于本机开发库里用户 Key 的加密；生产主密钥由部署环境注入
  key-encryption-key: AqYMLlOazvKA/ksxXCXHJR9L/AIiwSpFczT+3HjPPK4=
