# 开发环境配置：本地运行，宽松优先（SQL 日志、接口文档、长会话）
spring:
  # 启用 spring-session-redis 后，session 超时由这里控制
  session:
    timeout: 2592000 # 30 天
  # 本地敏感配置（数据库密码、沙箱密钥）从根目录 .env 读取；.env 已被 gitignore，不入库
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/oj_db
    username: root
    password: ${MYSQL_PASSWORD:}
server:
  port: 8102
  servlet:
    session:
      timeout: 2592000 # 会话 30 天过期（普通 servlet 会话以此为准）
      cookie:
        max-age: 2592000 # cookie 30 天过期
mybatis-plus:
  configuration:
    # 打开 SQL 日志，方便本地调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 接口文档（Knife4j）
knife4j:
  enable: true
# 代码沙箱类型选择
codesandbox:
  type: remote
  # 沙箱需要 Linux 环境，指向本机 WSL
  url: http://172.25.66.109:8100
  # 调用鉴权：ECDSA 请求签名，沙箱侧配置配套公钥（见 docs/sandbox-auth/README.md）
  auth:
    # 开发密钥从根目录 .env 读取（.env 不入库），生产环境用环境变量覆盖（见 application-prod.yml）
    key-id: ${CODESANDBOX_AUTH_KEY_ID:}
    private-key: ${CODESANDBOX_AUTH_PRIVATE_KEY:}
