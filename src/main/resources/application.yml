#file: noinspection YAMLSchemaValidation
# 公共配置文件：所有环境共享的配置，环境差异见 application-{profile}.yml
spring:
  application:
    name: my-oj
  # 默认 dev 环境（部署时用 --spring.profiles.active=prod 覆盖）
  profiles:
    active: dev
  # 数据库驱动（连接地址、账号等环境差异见各 profile 文件）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
server:
  address: 0.0.0.0
  servlet:
    context-path: /api
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档（开启/关闭见各 profile 文件）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hjl.oj.controller
knife4j:
  setting:
    language: zh_cn
# 远程代码沙箱公共配置
codesandbox:
  # 同时作为连接和读取超时，单位毫秒
  timeout: 60000
# 判题任务调度：question_submit 表即队列，轮询派发 + 有界并发削峰填谷（见 JudgeTaskDispatcher）
judge:
  queue:
    # 同时判题的最大提交数，取值按沙箱侧可用内存与容器峰值内存估算
    concurrency: 4
    # 轮询待判题任务的间隔（毫秒），也是提交后开始判题的最大延迟
    poll-interval-ms: 1000
    # 判题中超过该分钟数视为进程中断遗留，重置回待判题重判；0 关闭（须远大于判题最大耗时）
    stale-running-minutes: 10
