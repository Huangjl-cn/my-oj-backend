#file: noinspection YAMLSchemaValidation
# 公共配置文件
spring:
  application:
    name: my-oj
  # 默认 dev 环境
  profiles:
    active: dev
  # session 配置
  session:
    # 30 天过期
    timeout: 2592000
    # store-type: redis
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #url: jdbc:mysql://my-oj-db:3306/oj_db
    url: jdbc:mysql://localhost:3306/oj_db
    username: root
    password: MYSQL_PASSWORD_PLACEHOLDER
  # Redis 配置
  # redis:
  #   database: 1
  #   host: 127.0.0.1
  #   port: 6379
  #   timeout: 5000
  #   password: *******
  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
server:
  address: 0.0.0.0
  port: 8102
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: ''
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hjl.oj.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
#代码沙箱类型选择
codesandbox:
  type: remote
  # http://172.25.66.109:8100
  url: http://localhost:8100
