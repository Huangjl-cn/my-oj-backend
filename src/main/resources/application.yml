#file: noinspection YAMLSchemaValidation
# 公共配置文件：所有环境共享的配置，环境差异见 application-{profile}.yml
spring:
  application:
    name: my-oj
  # 不设默认 profile：必须显式指定环境，避免生产漏传参数时悄悄以开发配置运行。
  # 本地开发 mvn spring-boot:run 会自动激活 dev（见 pom.xml 的 spring-boot-maven-plugin）；
  # IDE 运行 MainApplication 时加 VM 参数 -Dspring.profiles.active=dev。
  # 数据库驱动（连接地址、账号等环境差异见各 profile 文件）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  servlet:
    context-path: /api
# 只开放健康检查 /api/actuator/health，只返回 UP / DOWN，不暴露组件明细（容器 healthcheck 和部署脚本用；
# 包含数据库连接检查，数据库连不上时是 DOWN）。nginx 对外屏蔽了 /api/actuator/
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档（开启/关闭见各 profile 文件）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hjl.oj.controller
knife4j:
  setting:
    language: zh_cn
# 远程代码沙箱公共配置
codesandbox:
  # 同时作为连接和读取超时，单位毫秒
  timeout: 60000
# 判题任务调度：question_submit 表即队列，轮询派发 + 有界并发削峰填谷（见 JudgeTaskDispatcher）
judge:
  queue:
    # 是否启动判题调度器（轮询派发 + 卡死回收）；测试上下文中关闭，避免领取真实的待判题记录
    enabled: true
    # 同时判题的最大提交数，取值按沙箱侧可用内存与容器峰值内存估算
    concurrency: 4
    # 轮询待判题任务的间隔（毫秒），也是提交后开始判题的最大延迟
    poll-interval-ms: 1000
    # 判题中超过该分钟数视为进程中断遗留，重置回待判题重判；0 关闭（须远大于判题最大耗时）
    stale-running-minutes: 10
# AI 陪练（LangChain4j 调用 DeepSeek，费用走用户自己的 API Key；绑定类见 ai/config/AiProperties）
# ai.mode 与加密主密钥 ai.key-encryption-key 按环境在 profile 文件中配置
ai:
  deepseek:
    base-url: https://api.deepseek.com
    default-model: deepseek-flash
    # 单次调用超时（含流式输出全过程），思考模式下的参考解法可能较慢
    timeout: 180s
    # 保存 Key 时校验调用的超时
    verify-timeout: 10s
    models:
      - id: deepseek-flash
        display-name: DeepSeek Flash（快、便宜）
        context-window: 1000000
      - id: deepseek-v4-pro
        display-name: DeepSeek V4 Pro（更强）
        context-window: 1000000
  companion:
    persona-name: 鸭鸭
    # 上下文占用达到模型窗口的该比例时，发送前自动压缩记忆
    compact-ratio: 0.8
    # 压缩时原样保留的最近轮数（一轮从一条用户消息开始）
    keep-recent-rounds: 4
    # 单次请求中用户代码、工具返回结果的最大字符数，超出部分截断并告知模型
    max-code-chars: 20000
    max-tool-result-chars: 4000
    # 工具"查我在本题的最近提交"返回的条数
    recent-submission-count: 5
    # 会话接口一次返回的历史消息条数
    history-page-size: 30
