name: my-oj

services:
  my-oj-db:
    image: mysql:8.4
    container_name: my-oj-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "MYSQL_PASSWORD_PLACEHOLDER"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: oj_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --table-open-cache=256
      - --max-connections=50
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - my-oj-db-data:/var/lib/mysql
      - ./oj-backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - my-oj-network

  my-oj-backend:
    build:
      context: ./oj-backend
      dockerfile: Dockerfile
    image: my-oj-backend:2.0.1
    container_name: my-oj-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai
      # 沙箱调用鉴权（值来自本目录 .env，application-prod.yml 从这两个环境变量读取）
      CODESANDBOX_AUTH_KEY_ID: ${CODESANDBOX_AUTH_KEY_ID}
      CODESANDBOX_AUTH_PRIVATE_KEY: ${CODESANDBOX_AUTH_PRIVATE_KEY}
    command:
      - --spring.profiles.active=prod
      - "--spring.datasource.url=jdbc:mysql://my-oj-db:3306/oj_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      - --spring.datasource.username=root
      - --spring.datasource.password=MYSQL_PASSWORD_PLACEHOLDER
      - --codesandbox.type=remote
      - --codesandbox.url=http://CODESANDBOX_PROD_URL_PLACEHOLDER:8100
    ports:
      - "127.0.0.1:8101:8101"
    volumes:
      - my-oj-backend-logs:/app/logs
    depends_on:
      my-oj-db:
        condition: service_healthy
    networks:
      - my-oj-network

  # 前端 Nginx 服务
  my-oj-frontend:
    image: nginx:1.30.4-alpine
    container_name: my-oj-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./oj-frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./oj-frontend/dist:/usr/share/nginx/html:ro
      - ./oj-frontend/certs:/etc/nginx/certs:ro
      - ./oj-frontend/acme-challenge:/var/www/acme
    depends_on:
      - my-oj-backend
    healthcheck:
      test:
        [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - my-oj-network

networks:
  my-oj-network:
    driver: bridge

volumes:
  my-oj-db-data:
  my-oj-backend-logs:
