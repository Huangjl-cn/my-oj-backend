name: my-oj

services:
  my-oj-db:
    image: mysql:8.4
    container_name: my-oj-db
    restart: unless-stopped
    # 以下账号只在首次初始化数据卷时创建；已有数据卷时改这里不会生效
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 中设置 MYSQL_ROOT_PASSWORD}
      # root 只允许在容器内登录（运维用 docker exec -it my-oj-db mysql -uroot -p）
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: oj_db
      # 应用专用账号，只授权 oj_db；账号名与 application-prod.yml 一致
      MYSQL_USER: oj_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 中设置 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --table-open-cache=256
      - --max-connections=50
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - my-oj-db-data:/var/lib/mysql
      # 首次初始化数据卷时执行的建表脚本：部署前从 sql/create_table.sql 复制（见 README），不入库
      - ./oj-backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - my-oj-network

  my-oj-backend:
    build:
      context: ./oj-backend
      dockerfile: Dockerfile
    image: my-oj-backend:2.0.1
    container_name: my-oj-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai
      # 应用配置只在 application-prod.yml（镜像固定 prod profile），这里只传它引用的环境变量，值来自 deploy/.env
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 中设置 MYSQL_PASSWORD}
      CODESANDBOX_URL: ${CODESANDBOX_URL:?请在 deploy/.env 中设置 CODESANDBOX_URL}
      CODESANDBOX_AUTH_KEY_ID: ${CODESANDBOX_AUTH_KEY_ID:?请在 deploy/.env 中设置 CODESANDBOX_AUTH_KEY_ID}
      CODESANDBOX_AUTH_PRIVATE_KEY: ${CODESANDBOX_AUTH_PRIVATE_KEY:?请在 deploy/.env 中设置 CODESANDBOX_AUTH_PRIVATE_KEY}
    ports:
      - "127.0.0.1:8101:8101"
    volumes:
      - my-oj-backend-logs:/app/logs
    depends_on:
      my-oj-db:
        condition: service_healthy
    networks:
      - my-oj-network

  # 前端 Nginx 服务：静态文件、nginx.conf 和证书放在 deploy/oj-frontend/（来自前端仓库，不在本仓库）
  my-oj-frontend:
    image: nginx:1.30.4-alpine
    container_name: my-oj-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./oj-frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./oj-frontend/dist:/usr/share/nginx/html:ro
      - ./oj-frontend/certs:/etc/nginx/certs:ro
      - ./oj-frontend/acme-challenge:/var/www/acme
    depends_on:
      - my-oj-backend
    healthcheck:
      test:
        [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - my-oj-network

networks:
  my-oj-network:
    driver: bridge

volumes:
  my-oj-db-data:
  my-oj-backend-logs:
