name: my-oj

services:
  my-oj-db:
    image: mysql:8.4
    container_name: my-oj-db
    restart: unless-stopped
    # 以下账号只在首次初始化数据卷时创建；已有数据卷时改这里不会生效
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 中设置 MYSQL_ROOT_PASSWORD}
      # root 只允许在容器内登录（运维用 docker exec -it my-oj-db mysql -uroot -p）
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: oj_db
      # 应用专用账号，只授权 oj_db；账号名与 application-prod.yml 一致
      MYSQL_USER: oj_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 中设置 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --table-open-cache=256
      - --max-connections=50
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - my-oj-db-data:/var/lib/mysql
      # 首次初始化数据卷时执行的建表脚本：部署前从 sql/create_table.sql 复制（见 README），不入库
      - ./oj-backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - my-oj-network

  my-oj-backend:
    # 镜像由部署脚本 server/deploy.sh 构建：每个版本打 my-oj-backend:<提交号>，正在用的那个再标成 current，
    # 回滚就是把 current 指回旧版本。这里不写 build，免得手动 up --build 用 oj-backend/ 下的旧 jar 覆盖掉 current
    image: my-oj-backend:current
    pull_policy: never
    container_name: my-oj-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai
      # 应用配置只在 application-prod.yml（镜像固定 prod profile），这里只传它引用的环境变量，值来自 deploy/.env
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 中设置 MYSQL_PASSWORD}
      CODESANDBOX_URL: ${CODESANDBOX_URL:?请在 deploy/.env 中设置 CODESANDBOX_URL}
      CODESANDBOX_AUTH_KEY_ID: ${CODESANDBOX_AUTH_KEY_ID:?请在 deploy/.env 中设置 CODESANDBOX_AUTH_KEY_ID}
      CODESANDBOX_AUTH_PRIVATE_KEY: ${CODESANDBOX_AUTH_PRIVATE_KEY:?请在 deploy/.env 中设置 CODESANDBOX_AUTH_PRIVATE_KEY}
      AI_KEY_ENCRYPTION_KEY: ${AI_KEY_ENCRYPTION_KEY:?请在 deploy/.env 中设置 AI_KEY_ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:8101:8101"
    volumes:
      - my-oj-backend-logs:/app/logs
    # 部署脚本等它变成 healthy 才算上线成功，否则切回上一版本；启动慢，前 3 分钟的失败不算
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8101/api/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    depends_on:
      my-oj-db:
        condition: service_healthy
    networks:
      - my-oj-network

  # 前端 Nginx 服务：nginx.conf 来自前端仓库，证书只放在服务器上。
  # 静态文件按版本放在 oj-frontend/www/releases/<时间-提交号>/，www/current 链接指向正在用的版本（见 server/deploy.sh）；
  # 必须挂载 www 整个目录：直接挂 current 的话，Docker 在挂载时就把链接解析死了，之后切换版本容器里看不到
  my-oj-frontend:
    image: nginx:1.30.4-alpine
    container_name: my-oj-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./oj-frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./oj-frontend/www:/usr/share/nginx/www:ro
      - ./oj-frontend/certs:/etc/nginx/certs:ro
      - ./oj-frontend/acme-challenge:/var/www/acme
    depends_on:
      - my-oj-backend
    healthcheck:
      test:
        [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - my-oj-network

networks:
  my-oj-network:
    driver: bridge

volumes:
  my-oj-db-data:
  my-oj-backend-logs:
